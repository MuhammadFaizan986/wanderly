[project]
name = "wanderly-api"
version = "0.1.0"
description = "Wanderly — AI-powered travel agency API"
authors = [{ name = "Muhammad Faizan", email = "faizan@teletrack.au" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "redis[hiredis]>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ASYNC", "RUF", "S"]
ignore = [
  "B008",   # FastAPI Depends() in argument defaults
  "RUF001", # typographic dashes in user-facing strings are intentional
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["arq.*", "asyncpg.*"]
ignore_missing_imports = true
