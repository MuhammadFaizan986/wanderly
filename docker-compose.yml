# Local development stack.
#   docker compose up -d                 -> Postgres + Redis (run API/web natively for hot reload)
#   docker compose --profile full up -d  -> also runs the API and ARQ worker in containers
name: wanderly

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wanderly
      POSTGRES_PASSWORD: wanderly
      POSTGRES_DB: wanderly
    ports:
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wanderly -d wanderly"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6390}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["full"]
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://wanderly:wanderly@postgres:5432/wanderly
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_HOST_PORT:-8100}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["full"]
    build: ./backend
    command: ["arq", "app.workers.settings.WorkerSettings"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://wanderly:wanderly@postgres:5432/wanderly
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
