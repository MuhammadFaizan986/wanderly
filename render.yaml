# Render Blueprint: New > Blueprint > pick this repo. Creates everything below.
# All services share one region so they talk over Render's private network.
# Secrets marked `sync: false` are asked for in the dashboard on first deploy.

databases:
  - name: wanderly-db
    databaseName: wanderly
    user: wanderly
    plan: basic-256mb
    region: singapore

services:
  - type: keyvalue
    name: wanderly-redis
    plan: free
    region: singapore
    ipAllowList: [] # private network only

  - type: web
    name: wanderly-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: wanderly-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wanderly-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL_TO
        sync: false
      - key: DUFFEL_API_TOKEN
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false

  - type: web
    name: wanderly-web
    runtime: node
    rootDir: frontend
    plan: starter
    region: singapore
    buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      # Private-network address of the API; next.config.ts turns it into the proxy target.
      - key: API_HOSTPORT
        fromService:
          type: web
          name: wanderly-api
          property: hostport
